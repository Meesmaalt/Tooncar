<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<style>
  @font-face {
    font-family: Race;
    src: url("file:///usr/share/fonts/truetype/liberation/LiberationSansNarrow-Bold.ttf") format("truetype");
    font-weight: 700;
  }
  html, body { margin: 0; padding: 0; background: #0c0d10; }
  .stage {
    width: 1200px;
    height: 630px;
    position: relative;
    overflow: hidden;
    background: #0c0d10;
  }
  .sky {
    position: absolute; inset: 0 0 38% 0;
    background:
      radial-gradient(ellipse 48% 34% at 70% 28%, rgba(255,232,170,0.55) 0%, transparent 58%),
      linear-gradient(180deg, #0c0d10 0%, #141821 42%, #3a4558 72%, #b88858 100%);
  }
  .sun {
    position: absolute;
    width: 108px; height: 108px; border-radius: 50%;
    left: 66%; top: 9%;
    background: radial-gradient(circle at 38% 36%, #fffdf2 0%, #ffe08a 40%, #f0c27a 72%, rgba(240,194,122,0) 100%);
    box-shadow: 0 0 70px 28px rgba(255,224,140,0.5), 0 0 140px 60px rgba(240,194,122,0.22);
  }
  .ocean {
    position: absolute; left: 0; right: 0; top: 52%; height: 18%;
    background:
      linear-gradient(180deg, rgba(90,170,196,0.85) 0%, #1a6b88 40%, #0e3d52 100%);
  }
  .ocean::after {
    content: "";
    position: absolute; inset: 0;
    background: repeating-linear-gradient(
      180deg,
      transparent 0 10px,
      rgba(200,204,212,0.12) 10px 12px
    );
    opacity: 0.45;
  }
  .beach {
    position: absolute; left: 0; right: 0; top: 66%; height: 10%;
    background:
      linear-gradient(180deg, #c4a06a 0%, #8a6a3e 100%);
  }
  .track-wrap {
    position: absolute;
    left: -20%;
    right: -20%;
    bottom: -8%;
    height: 48%;
    perspective: 280px;
    perspective-origin: 50% 0%;
  }
  .track {
    width: 100%;
    height: 140%;
    transform: rotateX(64deg);
    transform-origin: 50% 0%;
    background-image:
      linear-gradient(90deg, transparent 0 12%, rgba(12,13,16,0.35) 18%, transparent 28%, transparent 72%, rgba(12,13,16,0.35) 82%, transparent 88% 100%),
      linear-gradient(90deg, transparent 48.6%, #c8ccd4 48.6%, #c8ccd4 51.4%, transparent 51.4%),
      linear-gradient(90deg, #c24141 0 1.4%, transparent 1.4% 98.6%, #c24141 98.6% 100%),
      url("file:///workspace/.grok/og-refs/asphalt.jpg");
    background-size: 100% 100%, 100% 100%, 100% 100%, 280px 280px;
    box-shadow: inset 0 40px 60px rgba(12,13,16,0.45);
  }
  .skid {
    position: absolute; left: 38%; bottom: 6%; width: 34%; height: 10%;
    background: radial-gradient(ellipse, rgba(12,13,16,0.55) 0%, transparent 70%);
    transform: skewX(-28deg);
  }
  .vignette {
    position: absolute; inset: 0;
    background: radial-gradient(ellipse at 50% 48%, transparent 42%, rgba(12,13,16,0.55) 100%);
    pointer-events: none;
    z-index: 8;
  }
  .art, .lockup { position: absolute; inset: 0; }
  .art { z-index: 4; }
  .lockup { z-index: 12; pointer-events: none; }
</style>
</head>
<body>
  <div class="stage">
    <div class="sky"></div>
    <div class="sun"></div>
    <div class="ocean"></div>
    <div class="beach"></div>
    <div class="track-wrap"><div class="track"></div></div>
    <div class="skid"></div>
    <svg class="art" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">

      <g opacity="0.92">
        <rect x="470" y="268" width="10" height="92" rx="2" fill="#c8ccd4"/>
        <rect x="720" y="268" width="10" height="92" rx="2" fill="#c8ccd4"/>
        <rect x="458" y="258" width="284" height="18" rx="3" fill="#8a909a"/>
        <rect x="458" y="258" width="284" height="18" rx="3" fill="none" stroke="#c8ccd4" stroke-width="2"/>
        <g fill="#c24141">
          <circle cx="500" cy="267" r="5"/>
          <circle cx="560" cy="267" r="5"/>
          <circle cx="620" cy="267" r="5"/>

        <path d="M28 20 C78 6, 96 40, 62 50 C70 24, 44 16, 28 20" fill="#2f6a3a"/>

      <g opacity="0.35" fill="#c8ccd4">
        <ellipse cx="430" cy="560" rx="90" ry="22"/>

        <path d="M58 144 C70 108, 118 90, 174 88 C238 86, 290 104, 310 132 C326 150, 314 164, 284 168 L92 176 C62 174, 50 160, 58 144 Z" fill="#c24141"/>

        <!-- nose stripe -->
        <path d="M250 132 L312 140 L300 158 L244 150 Z" fill="#c8ccd4"/>

        <ellipse cx="286" cy="176" rx="38" ry="38" fill="#0c0d10"/>
        <ellipse cx="286" cy="176" rx="38" ry="38" fill="none" stroke="#c8ccd4" stroke-width="6"/>
        <ellipse cx="286" cy="176" rx="16" ry="16" fill="#1a1d24"/>
        <ellipse cx="286" cy="176" rx="6" ry="6" fill="#c8ccd4"/>
        <!-- chrome pipe -->
        <rect x="118" y="170" width="44" height="10" rx="4" fill="#c8ccd4"/>
      </g>
    </svg>
    <svg class="lockup" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <filter id="pop" x="-20%" y="-20%" width="140%" height="140%">
          <feDropShadow dx="0" dy="8" stdDeviation="0" flood-color="#0c0d10"/>
          <feDropShadow dx="0" dy="18" stdDeviation="14" flood-color="#0c0d10" flood-opacity="0.55"/>
        </filter>
      </defs>
      <g text-anchor="middle" font-family="Race, Liberation Sans Narrow, sans-serif" font-weight="700" filter="url(#pop)">
        <text x="600" y="292" font-size="168" letter-spacing="6" fill="#c8ccd4" stroke="#c24141" stroke-width="16" paint-order="stroke fill">ToonCar</text>
        <text x="600" y="430" font-size="132" letter-spacing="22" fill="#c24141" stroke="#c8ccd4" stroke-width="12" paint-order="stroke fill">GP</text>
      </g>
    </svg>
    <div class="vignette"></div>
  </div>
</body>
</html>
