<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<style>
  @font-face {
    font-family: Race;
    src: url("file:///usr/share/fonts/truetype/liberation/LiberationSansNarrow-Bold.ttf") format("truetype");
    font-weight: 700;
  }
  html, body { margin: 0; padding: 0; background: #0c0d10; }
  .stage {
    width: 1200px;
    height: 264px;
    position: relative;
    overflow: hidden;
    background: #0c0d10;
  }
  .sky {
    position: absolute; inset: 0 0 28% 0;
    background:
      radial-gradient(ellipse 34% 64% at 80% 18%, rgba(255,232,170,0.5) 0%, transparent 60%),
      linear-gradient(180deg, #0c0d10 0%, #1a2230 55%, #b88858 100%);
  }
  .sun {
    position: absolute;
    width: 54px; height: 54px; border-radius: 50%;
    left: 76%; top: 7%;
    background: radial-gradient(circle at 38% 36%, #fffdf2 0%, #ffe08a 42%, #f0c27a 78%, rgba(240,194,122,0) 100%);
    box-shadow: 0 0 36px 14px rgba(255,224,140,0.45);
  }
  .ocean {
    position: absolute; left: 0; right: 0; top: 48%; height: 22%;
    background: linear-gradient(180deg, #5aaac4 0%, #1a6b88 55%, #0e3d52 100%);
  }
  .beach {
    position: absolute; left: 0; right: 0; top: 66%; height: 10%;
    background: linear-gradient(180deg, #c4a06a 0%, #8a6a3e 100%);
  }
  .track-wrap {
    position: absolute;
    left: -10%; right: -10%; bottom: -20%;
    height: 52%;
    perspective: 180px;
  }
  .track {
    width: 100%; height: 160%;
    transform: rotateX(62deg);
    transform-origin: 50% 0%;
    background-image:
      linear-gradient(90deg, transparent 48.8%, #c8ccd4 48.8%, #c8ccd4 51.2%, transparent 51.2%),
      url("file:///workspace/.grok/og-refs/asphalt.jpg");
    background-size: 100% 100%, 220px 220px;
  }
  .vignette {
    position: absolute; inset: 0;
    background: radial-gradient(ellipse at 30% 40%, transparent 40%, rgba(12,13,16,0.5) 100%);
    z-index: 8; pointer-events: none;
  }
  .art, .lockup { position: absolute; inset: 0; }
  .art { z-index: 4; }
  .lockup { z-index: 12; pointer-events: none; }
</style>
</head>
<body>
  <div class="stage">

    <div class="ocean"></div>
